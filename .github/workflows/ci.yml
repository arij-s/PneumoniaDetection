name: Pneumonia Detection CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9"]  # Matches your environment.yml

    steps:
    - uses: actions/checkout@v3
      with:
        lfs: true  # For your model files

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglx0 libegl1  # Modern OpenGL alternatives
        sudo apt-get install -y python3-dev  # Required for some Python packages

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # Install OpenCV headless first to avoid GUI dependencies
        pip install opencv-python-headless==4.5.5.64
        # Install remaining packages from conda-forge equivalents
        pip install \
          numpy==1.20.0 \
          scikit-image==0.18.0 \
          scikit-learn==1.0.0 \
          matplotlib==3.4.0 \
          seaborn==0.11.0 \
          pandas==1.3.0 \
          joblib==1.0.0 \
          tqdm==4.60.0 \
          flask==2.0.0 \
          werkzeug==2.0.0 \
          pytest==6.0.0 \
          python-dateutil==2.8.2 \
          typing-extensions==4.0.0 \
          gunicorn==20.1.0 \
          mock==4.0.3 \
          json5==0.9.6 \
          unittest2==1.1.0

    - name: Lint with flake8
      run: |
        echo -e "[flake8]\nignore = E501,W503\nmax-line-length = 120\nexclude = \n    .git,\n    __pycache__,\n    */site-packages/*" > .flake8
        flake8 pneumonia_detection_app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 pneumonia_detection_app/ tests/ --count --exit-zero --max-complexity=15 --statistics

    - name: Run unit tests
      run: |
        pytest tests/ --cov=pneumonia_detection_app --cov-report=xml --verbose

    - name: Verify application startup
      run: |
        python pneumonia_detection_app/main.py --test-mode --no-gui
