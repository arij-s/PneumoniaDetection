name: Pneumonia Detection CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9"]  # Matches your project's Python version

    steps:
    - uses: actions/checkout@v3
      with:
        lfs: true  # For your model files

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx  # For OpenCV GUI dependencies

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 opencv-python-headless  # Using headless OpenCV

    - name: Lint with flake8
      run: |
        # Configure flake8 to ignore third-party packages and focus on your code
        echo -e "[flake8]\nignore = E501,W503\nmax-line-length = 120\nexclude = \n    .git,\n    __pycache__,\n    */site-packages/*,\n    */Lib/*,\n    */.ipynb_checkpoints/*" > .flake8
        
        # Strict linting only for your source files
        flake8 pneumonia_detection_app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        
        # General linting with warnings
        flake8 pneumonia_detection_app/ tests/ --count --exit-zero --max-complexity=15 --statistics

    - name: Run unit tests
      run: |
        pytest tests/ --cov=pneumonia_detection_app --cov-report=xml --verbose

    - name: Verify application startup
      run: |
        python pneumonia_detection_app/main.py --test-mode --no-gui
