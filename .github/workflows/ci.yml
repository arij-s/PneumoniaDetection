name: Pneumonia Detection CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9]  # Updated to Python 3.9 based on your project

    steps:
    - uses: actions/checkout@v3
      with:
        lfs: true  # Enable Git LFS for model files

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-cov flake8
    
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test with pytest
      run: |
        pytest --cov=./ --cov-report=xml
    
    # Only run the app as a verification step if main.py exists
    - name: Check if main.py exists
      id: check_files
      uses: andstor/file-existence-action@v2
      with:
        files: "main.py, pneumonia_detection_app/main.py"
        
    - name: Verify application startup
      if: steps.check_files.outputs.files_exists == 'true'
      run: |
        if [ -f "main.py" ]; then
          python main.py --test-mode || true
        elif [ -f "pneumonia_detection_app/main.py" ]; then
          python pneumonia_detection_app/main.py --test-mode || true
        fi
